<!DOCTYPE html>
<html>
<head>
  <title>Church Songs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="init()">

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div id="menu" class="menu hidden">
    <div onclick="goHome()">🏠 Home</div>
    <div id="switchLogin" onclick="switchLogin()">🔁 Switch Login</div>
    <div onclick="logout()">🚪 Logout</div>
    <hr>
    <div onclick="alert('Future feature')">✨ Additional Feature</div>
  </div>
</header>

<input id="search" class="search-box" placeholder="🔍 Search song..." onkeyup="searchSongs()">

<div class="tab-bar">
  <div class="tab active" onclick="showTab('songs',this)">🎵 Songs</div>
  <div class="tab" onclick="showTab('recent',this)">🕘 Recently</div>
  <div class="tab" onclick="showTab('fav',this)">⭐ Favorites</div>
</div>

<div class="content-area">
  <div id="songsTab"></div>
  <div id="recentTab" class="hidden"></div>
  <div id="favTab" class="hidden"></div>
</div>

<a href="add-song.html" id="addBtn" class="floating-btn">➕</a>

<script src="script.js"></script>
</body>
</html>
