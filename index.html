<!DOCTYPE html>
<html>
<head>
  <title>Church Songs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="init()">

<header>
  <img src="https://richcodz-cloud.github.io/church-lyrics/Arise%20&%20Shine%20Logo%20.png">
</header>

<input id="search" class="search-box" placeholder="🔍 Search song..." onkeyup="searchSongs()">

<!-- TAB BAR -->
<div class="tab-bar">
  <div class="tab active" onclick="showTab('songs',this)">🎵 Songs</div>
  <div class="tab" onclick="showTab('recent',this)">🕘 Recently</div>
  <div class="tab" onclick="showTab('fav',this)">⭐ Favorites</div>
</div>

<div class="content-area">
  <div id="songsTab"></div>
  <div id="recentTab" class="hidden"></div>
  <div id="favTab" class="hidden"></div>
</div>

<a href="add-song.html" id="addBtn" class="floating-btn">➕</a>

<script src="script.js"></script>
</body>
</html>
