<!DOCTYPE html>
<html>
<head>
  <title>Add Song</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-box">
  <input id="title" placeholder="Song Title">
  <input id="category" placeholder="Category">
  <textarea id="lyrics" placeholder="Lyrics"></textarea>
  <button onclick="save()">Save</button>
</div>

<script>
if(localStorage.role!=="admin") location.href="index.html";

function save(){
  let s = JSON.parse(localStorage.songs || "[]");
  s.push({title:title.value,category:category.value,lyrics:lyrics.value});
  localStorage.songs = JSON.stringify(s);
  location.href="index.html";
}
</script>
</body>
</html>
