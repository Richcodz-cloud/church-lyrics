<!DOCTYPE html>
<html>
<head>
  <title>Edit Song</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="load()">

<div class="form-box">
  <input id="title">
  <input id="category">
  <textarea id="lyrics"></textarea>
  <button onclick="update()">Update</button>
</div>

<script>
let i=localStorage.edit;
let songs=JSON.parse(localStorage.songs);

function load(){
  let s=songs[i];
  title.value=s.title;
  category.value=s.category;
  lyrics.value=s.lyrics;
}
function update(){
  songs[i]={title:title.value,category:category.value,lyrics:lyrics.value};
  localStorage.songs=JSON.stringify(songs);
  location.href="index.html";
}
</script>
</body>
</html>
