<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Worship Songs</title>
<link rel="stylesheet" href="style.css">
</head>
<body onload="loadSongs()">

<header>
    <div class="header-container">
        <img src="logo.png" alt="Church Logo" class="church-logo">
        <h1>✝️ Church Worship Songs</h1>
        <p>Praise the Lord</p>
    </div>

    <div class="hamburger-menu" id="hamburgerMenu">
        ☰
        <div class="menu-content" id="menuContent">
            <button onclick="logout()">🚪 Logout</button>
            <button onclick="toggleTheme()">🌙 / ☀️ Theme</button>
        </div>
    </div>
</header>

<main id="songSection">
    <input type="text" id="searchBox" placeholder="🔍 Search worship song..." onkeyup="searchSongs()" class="search-box">
    <a id="addBtn" href="javascript:addSong()" class="add-btn" style="display:none;">➕ Add Song</a>
    <ul id="songList" class="song-list"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
