<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Worship Songs</title>
<link rel="stylesheet" href="style.css">
</head>
<body onload="loadSongs()">

<header>
<h1>✝️ Church Worship Songs</h1>
<p>Praise the Lord</p>
</header>

<div id="loginBox" class="login-box">
<h3>Login</h3>
<button onclick="memberLogin()">👥 Enter as Member</button>
<hr>
<input type="password" id="adminPwd" placeholder="Admin Password">
<button onclick="adminLogin()">🔐 Admin Login</button>
</div>

<main id="songSection" style="display:none;">
<button onclick="logout()">🚪 Logout</button>
<button onclick="toggleTheme()">🌙 Dark Mode</button>

<div class="search-container">
<input type="text" id="searchBox" placeholder="🔍 Search worship song...">
<button onclick="searchSongs()">Search</button>
</div>

<a id="addBtn" href="add-song.html" class="add-btn" style="display:none;">➕ Add Song</a>

<ul id="songList"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
