<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Change Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h3>Change Admin Password</h3>
<input id="oldPwd" type="password" placeholder="Old Password">
<input id="newPwd" type="password" placeholder="New Password">
<button onclick="changePassword()">Update</button>

<script>
function changePassword(){
  let old=localStorage.getItem("adminPwd")||"admin123";
  if(oldPwd.value!==old) return alert("Wrong old password");
  localStorage.setItem("adminPwd",newPwd.value);
  alert("Password updated");
}
</script>
</body>
</html>
