<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-container">
        <img src="https://richcodz-cloud.github.io/church-lyrics/Arise%20&%20Shine%20Logo%20.png" alt="Church Logo" class="church-logo">
        <h1>✝️ Church Worship Songs</h1>
        <p>Praise the Lord</p>
    </div>
</header>

<div id="loginBox" class="login-box">
    <h3>Login</h3>
    <input type="password" id="loginPwd" placeholder="Enter Password">
    <div class="login-buttons">
        <button onclick="memberLogin()">👥 Member Login</button>
        <button onclick="adminLogin()">🔐 Admin Login</button>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
