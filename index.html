<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Worship Songs</title>
<link rel="stylesheet" href="style.css">
</head>
<body onload="loadSongs()">

<header>
<h1>✝️ Church Worship Songs</h1>
<p>Praise the Lord</p>

<!-- Hamburger menu -->
<div class="hamburger-menu" id="hamburgerMenu">
    ☰
    <div class="menu-content" id="menuContent">
        <button onclick="logout()">🚪 Logout</button>
        <button onclick="toggleTheme()">🌙 / ☀️ Theme</button>
    </div>
</div>
</header>

<main id="songSection">
    <input type="text" id="searchBox" placeholder="🔍 Search worship song..." onkeyup="searchSongs()" class="search-box">
    <a id="addBtn" href="add-song.html" class="add-btn" style="display:none;">➕ Add Song</a>
    <ul id="songList" class="song-list"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
